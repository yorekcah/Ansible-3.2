---
- name: Add Istio Helm repo (online)
  ansible.builtin.shell: helm repo add istio https://istio-release.storage.googleapis.com/charts 2>/dev/null || true && helm repo update
  environment:
    KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
  when: not offline_install | bool

- name: Create istio-system namespace
  ansible.builtin.shell: kubectl create namespace istio-system --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"

- name: Install Istio base
  ansible.builtin.command: >
    helm upgrade --install istio-base
    {{ (local_charts_dir ~ '/base-' ~ istio_version ~ '.tgz') if offline_install else 'istio/base' }}
    --namespace istio-system
    --version {{ istio_version }}
    --set global.istioNamespace=istio-system
  environment:
    KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"

- name: Install Istio discovery (istiod)
  ansible.builtin.command: >
    helm upgrade --install istiod
    {{ (local_charts_dir ~ '/istiod-' ~ istio_version ~ '.tgz') if offline_install else 'istio/istiod' }}
    --namespace istio-system
    --version {{ istio_version }}
  environment:
    KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"

- name: Install Istio ingress gateway
  ansible.builtin.command: >
    helm upgrade --install istio-ingressgateway
    {{ (local_charts_dir ~ '/gateway-' ~ istio_version ~ '.tgz') if offline_install else 'istio/gateway' }}
    --namespace istio-system
    --version {{ istio_version }}
    --set service.type=LoadBalancer
  environment:
    KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"

- name: Wait for Istiod
  ansible.builtin.command: kubectl rollout status deployment istiod -n istio-system --timeout=300s
  environment:
    KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"

- name: Wait for Istio ingress gateway
  ansible.builtin.command: kubectl rollout status deployment istio-ingressgateway -n istio-system --timeout=300s
  environment:
    KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"

- name: Label default namespace for Istio injection (optional)
  ansible.builtin.command: kubectl label namespace default istio-injection=enabled --overwrite
  environment:
    KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
