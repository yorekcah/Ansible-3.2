---
- name: Validate Garage credentials
  ansible.builtin.assert:
    that:
      - garage_rpc_secret is match('^[0-9a-fA-F]{64}$')
      - garage_admin_token | length >= 16
      - velero_s3_access_key | length >= 12
      - velero_s3_secret_key | length >= 32
    fail_msg: "Set valid Garage and Velero credentials in the encrypted Ansible vault."

- name: Create Garage namespace
  ansible.builtin.shell: kubectl create namespace garage --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"

- name: Template Garage config Secret
  ansible.builtin.template:
    src: garage-config.toml.j2
    dest: /tmp/garage-config.toml

- name: Create Garage config Secret
  ansible.builtin.shell: kubectl create secret generic garage-config --from-file=/tmp/garage-config.toml -n garage --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"

- name: Template Garage manifests
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/tmp/{{ item }}"
  loop:
    - garage-service.yaml
    - garage-statefulset.yaml

- name: Apply Garage manifests
  ansible.builtin.command: kubectl apply -f /tmp/{{ item }} -n garage
  loop:
    - garage-service.yaml
    - garage-statefulset.yaml
  environment:
    KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"

- name: Wait for Garage pods
  ansible.builtin.command: kubectl rollout status statefulset garage -n garage --timeout=300s
  environment:
    KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
